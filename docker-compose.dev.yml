# Local dev infrastructure for Architecture B: Postgres + RabbitMQ.
#   docker compose -f docker-compose.dev.yml up -d
#
# RabbitMQ management UI: http://localhost:15672  (login: guest / guest)
#   — watch messages flow through khaata.reminders.queue and the dead-letter queue.
#
# Then run the backend (it reads .env for channel=email + SMTP + rabbitmq):
#   SPRING_PROFILES_ACTIVE=devpg mvn spring-boot:run     (Postgres)
#   or just: mvn spring-boot:run                          (H2 in-memory)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: khaata
      POSTGRES_USER: khaata
      POSTGRES_PASSWORD: khaata
    ports:
      - "5432:5432"
    volumes:
      - khaata_pgdata_dev:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"      # AMQP port the app connects to
      - "15672:15672"    # management web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  khaata_pgdata_dev:
