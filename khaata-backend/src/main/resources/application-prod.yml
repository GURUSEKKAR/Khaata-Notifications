# Prod profile: PostgreSQL + a real notification channel + optional RabbitMQ.
# All secrets come from environment variables (never committed).
server:
  # Render (and most PaaS) inject the port to listen on via $PORT.
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/khaata}
    username: ${DB_USERNAME:khaata}
    password: ${DB_PASSWORD:khaata}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  # CloudAMQP gives a single amqps URL — Spring reads it via 'addresses'.
  # If RABBITMQ_URL is unset, this stays blank and the queue is disabled (fallback).
  rabbitmq:
    addresses: ${RABBITMQ_URL:}
    listener:
      simple:
        # Start the consumer whenever a broker is configured. (The whole messaging
        # layer is already gated by khaata.queue.enabled via @ConditionalOnProperty.)
        auto-startup: true
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
          max-interval: 10s
        default-requeue-rejected: false
  # Email (Gmail SMTP). Port 465 (SSL) — many cloud hosts block 587 (STARTTLS).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

khaata:
  # Turn the message queue on in prod by setting KHAATA_QUEUE_ENABLED=true
  # (and providing RABBITMQ_URL). If false/unset, reminders send directly (fallback).
  queue:
    enabled: ${KHAATA_QUEUE_ENABLED:false}
  notification:
    # Set via env in prod: console | email | telegram | twilio. Defaults to email.
    channel: ${KHAATA_NOTIFICATION_CHANNEL:email}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
