# Prod profile: PostgreSQL + a real notification channel.
# All secrets come from environment variables (never committed).
server:
  # Render (and most PaaS) inject the port to listen on via $PORT.
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/khaata}
    username: ${DB_USERNAME:khaata}
    password: ${DB_PASSWORD:khaata}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

khaata:
  notification:
    # Set via env in prod: console | twilio | telegram. Defaults to telegram.
    channel: ${KHAATA_NOTIFICATION_CHANNEL:telegram}
